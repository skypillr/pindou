<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<div class="app">

  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>🎨 拼豆图纸定制</h1>
      <p>Perler Bead Pattern Maker</p>
    </div>


    <div class="section">
      <div class="section-title">项目</div>
      <button class="btn btn-primary" onclick="document.getElementById('imageInput').click()">📷 上传图片</button>
      <input type="file" id="imageInput" accept="image/*">
      <button class="btn btn-secondary" onclick="newProject()">🆕 新建空白</button>
      <button class="btn btn-secondary" onclick="document.getElementById('loadInput').click()">📂 打开项目</button>
      <input type="file" id="loadInput" accept=".json">
      <button class="btn btn-secondary" onclick="saveProject()">💾 保存项目</button>
      <div class="autosave-row">
        <label><input type="checkbox" id="autosaveEnabled" checked> 自动保存</label>
        <input type="number" id="autosaveSecs" min="1" max="600" value="5">
        <span class="autosave-unit">秒/次</span>
      </div>
      <div class="autosave-status" id="autosaveStatus">尚未自动保存</div>
    </div>


    <div class="section">
      <div class="section-title">画布尺寸</div>
      <div class="input-group">
        <label>宽</label>
        <input type="number" id="colsInput" value="29" min="5" max="200">
      </div>
      <div class="input-group">
        <label>高</label>
        <input type="number" id="rowsInput" value="29" min="5" max="200">
      </div>
      <button class="btn btn-secondary" onclick="resizeCanvasSize()">🔄 调整大小</button>
      <button class="btn btn-secondary" onclick="clearCanvas()">🗑️ 清空画布</button>
    </div>


    <div class="section">
      <div class="section-title">显示</div>
      <label class="toggle-row"><input type="checkbox" id="showGrid" checked onchange="redraw()"> 网格线</label>
      <label class="toggle-row"><input type="checkbox" id="showNumbers" onchange="redraw()"> 颜色编号</label>
      <div class="section-title" style="margin-top:12px">风格化</div>
      <div class="style-chips" id="styleChips">
        <button class="style-chip active" data-style="none" onclick="setImageStyle('none')">原图</button>
        <button class="style-chip" data-style="oil" onclick="setImageStyle('oil')">油画</button>
        <button class="style-chip" data-style="watercolor" onclick="setImageStyle('watercolor')">水彩</button>
        <button class="style-chip" data-style="sketch" onclick="setImageStyle('sketch')">素描</button>
        <button class="style-chip" data-style="cartoon" onclick="setImageStyle('cartoon')">卡通</button>
        <button class="style-chip" data-style="emboss" onclick="setImageStyle('emboss')">浮雕</button>
      </div>
    </div>


    <div class="section">
      <div class="section-title">导出</div>
      <button class="btn btn-primary" onclick="showExportImageModal()">🖼️ 导出完整图纸图片</button>
      <button style="display: none;" class="btn btn-secondary" onclick="exportPattern()">📋 打印图纸(含图例)</button>
      <button class="btn btn-secondary" onclick="showColorCounts()">📊 颜色用量统计</button>
    </div>


    <div class="section" id="licenseSection">
      <div class="section-title">授权信息</div>
      <div style="font-size:12px;color:#555;display:flex;align-items:center;gap:6px">
        <span id="licenseBadge" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#ccc;flex-shrink:0"></span>
        <span id="licenseStatusText">检测中...</span>
      </div>
      <div id="licenseDetail" style="font-size:11px;color:#999;margin-top:4px;line-height:1.6"></div>
      <div id="licenseVersion" style="font-size:11px;color:#aaa;margin-top:6px;padding-top:6px;border-top:1px dashed #eee">版本号：V1.0.0.0</div>
      <button class="btn btn-secondary" id="licenseUnbindBtn" style="display:none;margin-top:6px" onclick="deactivateLicense()">🔓 卸载授权</button>
    </div>

  </aside>


  <main class="main">
    <div class="toolbar">
      <button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()" aria-label="菜单" title="菜单">☰</button>
      <div class="history-controls">
        <button class="history-btn" id="undoBtn" onclick="undo()" title="撤销 (Ctrl+Z)">↶</button>
        <button class="history-btn" id="redoBtn" onclick="redo()" title="重做 (Ctrl+Shift+Z)">↷</button>
      </div>
      <span style="font-size:13px;color:#666;display: none;">格子大小:</span>
      <select id="cellSizeSelect" onchange="changeCellSize()" style="display: none; padding:6px 10px;border:1px solid #ddd;border-radius:4px;">
        <option value="4">4px</option>
        <option value="6">6px</option>
        <option value="8">8px</option>
        <option value="16">16px</option>
        <option value="20" selected>20px</option>
        <option value="24">24px</option>
        <option value="32">32px</option>
        <option value="40">40px</option>
      </select>
      <div class="tools toolbar-tools">
        <button class="tool-btn active" data-tool="paint" onclick="setTool('paint')" title="画笔">
          <span class="icon">🖌️</span><span class="tool-label">画笔</span>
        </button>
        <button class="tool-btn" data-tool="erase" onclick="setTool('erase')" title="橡皮">
          <span class="icon">🧽</span><span class="tool-label">橡皮</span>
        </button>
        <button class="tool-btn" data-tool="fill" onclick="setTool('fill')" title="填充">
          <span class="icon">🪣</span><span class="tool-label">填充</span>
        </button>
        <button class="tool-btn" data-tool="picker" onclick="setTool('picker')" title="取色">
          <span class="icon">💧</span><span class="tool-label">取色</span>
        </button>
        <button class="tool-btn" data-tool="replace" onclick="setTool('replace')" title="点击画布选源颜色，再点调色板选目标">
          <span class="icon">🔄</span><span class="tool-label">替换</span>
        </button>
        <button class="tool-btn" data-tool="pan" onclick="setTool('pan')" title="选中后按住画布拖动即可平移查看">
          <span class="icon">🖐️</span><span class="tool-label">拖动</span>
        </button>
      </div>
      <div class="zoom-controls">
        <button class="zoom-btn" onclick="changeCellSize(-4)">−</button>
        <span class="zoom-label" id="zoomLabel">20px</span>
        <button class="zoom-btn" onclick="changeCellSize(4)">+</button>
      </div>
      <button class="lang-toggle" id="langToggle" onclick="toggleLanguage()" title="Switch to English" aria-label="Switch to English">EN</button>
    </div>

    <div class="canvas-area" id="canvasArea">
      <div class="canvas-wrapper">
        <div class="ruler ruler-top" id="rulerTop"></div>
        <div class="ruler ruler-left" id="rulerLeft"></div>
        <div class="ruler ruler-right" id="rulerRight"></div>
        <div class="ruler ruler-bottom" id="rulerBottom"></div>
        <canvas id="gridCanvas"></canvas>
        <canvas id="hoverCanvas"></canvas>
      </div>
    </div>

    <div class="statusbar">
      <span id="statusSize">尺寸: 29 × 29</span>
      <span id="statusPos">位置: -</span>
      <span id="statusColors">已用颜色: 0</span>
      <span id="statusBeads">总豆数: 0</span>
      <span class="status-color" title="当前颜色">
        <span class="status-swatch" id="statusSwatch"></span>
        <span id="statusColorName">-</span>
        <span class="status-color-id" id="statusColorId">-</span>
      </span>

      <span id="replaceHintSection" class="status-replace" style="display:none">
        <span id="replaceHint">
          <span id="replaceStep1">① 在画布上点一下要被替换的颜色</span>
          <span id="replaceStep2" style="display:none">
            已选：
            <span id="replaceFromSwatch" class="status-replace-swatch"></span>
            <b id="replaceFromLabel"></b>
            <span class="status-replace-arrow">→</span>
            <span id="replaceToSwatch" class="status-replace-swatch" style="background:#fff"></span>
            <span id="replaceToLabel" class="status-replace-label">点调色板选目标色</span>
          </span>
          <button class="status-replace-cancel" onclick="cancelReplace()">取消替换</button>
        </span>
      </span>
      <span class="status-tip">💡 按住空格+拖动 或 中键拖动 平移画布</span>
    </div>
  </main>
</div>

  <div class="modal">
