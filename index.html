﻿<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拼豆图纸定制系统</title>
<style>*{box-sizing: border-box;margin: 0;padding: 0}body{font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background: #f5f5f5;color: #333;height: 100vh;overflow: hidden}.app{display: flex;height: 100vh;min-height: 0;min-width: 0}.sidebar{width: 280px;background: #fff;border-right: 1px solid #e0e0e0;display: flex;flex-direction: column;overflow-y: auto;flex-shrink: 0}.sidebar-header{padding: 16px;border-bottom: 1px solid #eee;background: linear-gradient(135deg,#667eea,#764ba2);color: #fff}.sidebar-header h1{font-size: 18px;font-weight: 600}.sidebar-header p{font-size: 12px;opacity: 0.85;margin-top: 4px}.section{padding: 12px 16px;border-bottom: 1px solid #f0f0f0}.section-title{font-size: 12px;font-weight: 600;color: #888;text-transform: uppercase;margin-bottom: 10px;letter-spacing: 0.5px}.btn{display: inline-block;padding: 8px 14px;border: none;border-radius: 6px;font-size: 13px;cursor: pointer;transition: all 0.15s;font-weight: 500}.btn-primary{background: #667eea;color: #fff;width: 100%;margin-bottom: 8px}.btn-primary:hover{background: #5a6fd6}.btn-secondary{background: #f0f0f0;color: #555;width: 100%;margin-bottom: 8px}.btn-secondary:hover{background: #e4e4e4}.btn-danger{background: #fee;color: #c33}.btn-danger:hover{background: #fdd}.btn:disabled{opacity: 0.4;cursor: not-allowed}.input-group{display: flex;align-items: center;gap: 8px;margin-bottom: 8px}.input-group label{font-size: 13px;color: #666;min-width: 50px}.input-group input[type="number"]{width: 70px;padding: 6px 8px;border: 1px solid #ddd;border-radius: 4px;font-size: 13px}.tools{display: flex;gap: 6px;flex-wrap: wrap}.tool-btn{flex: 1;min-width: 60px;padding: 8px;border: 2px solid transparent;background: #f8f8f8;border-radius: 6px;cursor: pointer;font-size: 11px;text-align: center;transition: all 0.15s}.tool-btn:hover{background: #eee}.tool-btn.active{border-color: #667eea;background: #eef;color: #667eea}.tool-btn .icon{font-size: 18px;display: block;margin-bottom: 2px}.palette{display: grid;grid-template-columns: repeat(6,1fr);gap: 4px;max-height: 260px;overflow-y: auto}.color-swatch{aspect-ratio: 1;border-radius: 4px;cursor: pointer;border: 2px solid transparent;position: relative;transition: transform 0.1s}.color-swatch:hover{transform: scale(1.15);z-index: 10}.color-swatch.active{border-color: #333;box-shadow: 0 0 0 2px #fff,0 0 0 4px #667eea}.color-swatch .color-id{position: absolute;bottom: 1px;right: 2px;font-size: 8px;color: #fff;text-shadow: 0 0 2px rgba(0,0,0,0.8);font-weight: 600}.selected-color{display: flex;align-items: center;gap: 10px;padding: 8px;background: #f8f8f8;border-radius: 6px;margin-bottom: 10px}.selected-swatch{width: 36px;height: 36px;border-radius: 6px;border: 2px solid #ddd}.selected-info{flex: 1}.selected-info .name{font-size: 13px;font-weight: 500}.selected-info .id{font-size: 11px;color: #888}.main{flex: 1;display: flex;flex-direction: column;overflow: hidden;min-height: 0}.toolbar{padding: 10px 16px;background: #fff;border-bottom: 1px solid #e0e0e0;display: flex;align-items: center;gap: 12px;flex-wrap: wrap;flex-shrink: 0}.history-controls{display: flex;gap: 4px;margin-right: 8px;padding-right: 12px;border-right: 1px solid #e0e0e0}.history-btn{width: 32px;height: 32px;border: 1px solid #ddd;background: #fff;border-radius: 4px;cursor: pointer;font-size: 16px;display: flex;align-items: center;justify-content: center;transition: all 0.15s;position: relative}.history-btn:hover:not(:disabled){background: #f5f5f5;border-color: #667eea;color: #667eea}.history-btn:disabled{opacity: 0.35;cursor: not-allowed}.history-btn .kbd{position: absolute;bottom: -16px;font-size: 9px;color: #999;white-space: nowrap;pointer-events: none}.zoom-controls{display: flex;align-items: center;gap: 6px;margin-left: auto}.zoom-btn{width: 32px;height: 32px;border: 1px solid #ddd;background: #fff;border-radius: 4px;cursor: pointer;font-size: 16px}.zoom-btn:hover{background: #f5f5f5}.zoom-label{font-size: 12px;color: #666;min-width: 50px;text-align: center}.canvas-area{flex: 1;overflow: auto;background: #e8e8e8;background-image: radial-gradient(#ccc 1px,transparent 1px);background-size: 20px 20px;display: flex;align-items: flex-start;justify-content: flex-start;padding: 20px;position: relative;min-height: 0}.canvas-area.panning{cursor: grabbing !important}.canvas-area.panning #gridCanvas{cursor: grabbing !important}.canvas-wrapper{position: relative;background: #fff;box-shadow: 0 2px 12px rgba(0,0,0,0.1);margin: auto;flex-shrink: 0}#gridCanvas{display: block;cursor: crosshair;image-rendering: pixelated}body.space-held #gridCanvas{cursor: grab !important}body.space-held.panning #gridCanvas{cursor: grabbing !important}body.space-held .canvas-area{cursor: grab !important}.statusbar{padding: 6px 16px;background: #fff;border-top: 1px solid #e0e0e0;font-size: 12px;color: #888;display: flex;gap: 16px;align-items: center;flex-shrink: 0}.statusbar span{display: flex;align-items: center;gap: 4px}.status-tip{margin-left: auto;font-size: 11px;color: #aaa}.modal-overlay{position: fixed;inset: 0;background: rgba(0,0,0,0.5);display: none;align-items: center;justify-content: center;z-index: 1000}.modal-overlay.show{display: flex}.modal{background: #fff;border-radius: 12px;padding: 24px;max-width: 500px;width: 90%;max-height: 80vh;overflow-y: auto}.modal h2{margin-bottom: 16px;font-size: 18px}.modal .btn{margin-top: 12px}.color-counts{max-height: 300px;overflow-y: auto}.color-count-item{display: flex;align-items: center;padding: 6px 0;border-bottom: 1px solid #f0f0f0}.color-count-swatch{width: 20px;height: 20px;border-radius: 3px;margin-right: 10px;border: 1px solid #ddd}.color-count-name{flex: 1;font-size: 13px}.color-count-num{font-size: 13px;font-weight: 600;color: #667eea;min-width: 40px;text-align: right}::-webkit-scrollbar{width: 8px;height: 8px}::-webkit-scrollbar-track{background: #f1f1f1}::-webkit-scrollbar-thumb{background: #ccc;border-radius: 4px}::-webkit-scrollbar-thumb:hover{background: #aaa}input[type="file"]{display: none}.toast{position: fixed;bottom: 50px;left: 50%;transform: translateX(-50%);background: rgba(0,0,0,0.75);color: #fff;padding: 8px 18px;border-radius: 20px;font-size: 13px;z-index: 2000;opacity: 0;transition: opacity 0.2s;pointer-events: none}.toast.show{opacity: 1}.license-overlay{position: fixed;inset: 0;background: rgba(15,23,42,0.93);z-index: 10000;display: none;align-items: center;justify-content: center;backdrop-filter: blur(4px)}.license-overlay.show{display: flex}.license-card{width: 420px;max-width: 92vw;max-height: 92vh;overflow-y: auto;background: #fff;border-radius: 12px;padding: 28px;box-shadow: 0 20px 60px rgba(0,0,0,0.5)}.license-card h1{font-size: 20px;margin: 0 0 4px;color: #333}.license-card .sub{font-size: 12px;color: #888;margin-bottom: 18px}.license-card input[type="text"],.license-card input[type="password"],.license-card select{width: 100%;padding: 9px 10px;border: 1px solid #ddd;border-radius: 6px;font-size: 13px;box-sizing: border-box}.license-msg{font-size: 12px;min-height: 16px;margin-top: 6px;color: #e63946}.license-msg.ok{color: #2a9d4f}.ui-prompt-mask{position: fixed;inset: 0;background: rgba(15,23,42,0.55);z-index: 99999;display: flex;align-items: center;justify-content: center}.ui-prompt-card{width: 320px;background: #fff;border-radius: 10px;padding: 20px;box-shadow: 0 20px 50px rgba(0,0,0,0.3)}.ui-prompt-title{font-size: 14px;font-weight: 600;color: #333;margin-bottom: 12px}.ui-prompt-input{width: 100%;padding: 8px 10px;border: 1px solid #ddd;border-radius: 6px;font-size: 14px}.ui-prompt-actions{display: flex;gap: 8px;justify-content: flex-end;margin-top: 14px}.ui-prompt-btn{padding: 7px 16px;border: none;border-radius: 6px;font-size: 13px;cursor: pointer}.ui-prompt-btn.cancel{background: #f0f0f0;color: #555}.ui-prompt-btn.cancel:hover{background: #e4e4e4}.ui-prompt-btn.ok{background: #667eea;color: #fff}.ui-prompt-btn.ok:hover{background: #5a6fd6}.sidebar-toggle{display: none;width: 36px;height: 36px;border: 1px solid #ddd;background: #fff;border-radius: 6px;cursor: pointer;align-items: center;justify-content: center;font-size: 20px;flex-shrink: 0}.sidebar-toggle:active{background: #eee}.sidebar-overlay{position: fixed;inset: 0;background: rgba(15,23,42,0.45);z-index: 1999;display: none}.sidebar-overlay.show{display: block}@media (max-width: 1024px){.sidebar{width: 240px}.palette{grid-template-columns: repeat(5,1fr)}.section{padding: 10px 12px}}@media (max-width: 768px){body{height: 100dvh}.app{flex-direction: column;height: 100dvh}.sidebar{position: fixed;top: 0;left: 0;bottom: 0;width: 300px;max-width: 85vw;transform: translateX(-100%);transition: transform 0.25s ease;z-index: 2000;box-shadow: 2px 0 12px rgba(0,0,0,0.15)}body.sidebar-open .sidebar{transform: translateX(0)}.main{flex: 1;min-height: 0}.toolbar{padding: 8px 10px;gap: 8px;position: sticky;top: 0;z-index: 10}.sidebar-toggle{display: inline-flex}.history-btn{width: 34px;height: 34px}.history-btn .kbd{display: none}.zoom-controls{margin-left: auto}.zoom-btn{width: 34px;height: 34px}.canvas-area{padding: 12px;background-size: 14px 14px}.canvas-wrapper{max-width: none;box-shadow: 0 1px 6px rgba(0,0,0,0.08)}.statusbar{padding: 6px 10px;font-size: 11px;gap: 10px;flex-wrap: wrap}.statusbar .status-tip{display: none}.tool-btn{min-height: 44px;font-size: 12px}.color-swatch{border-width: 3px}.color-swatch .color-id{font-size: 9px}.palette{grid-template-columns: repeat(6,1fr);max-height: 40vh}.modal{max-width: 96vw;max-height: 92dvh;padding: 18px}.license-card{padding: 20px 16px}}@media (max-width: 380px){.toolbar select,.toolbar label,.toolbar span:not(.zoom-label){font-size: 11px}.history-controls{margin-right: 4px;padding-right: 8px;gap: 2px}}</style>
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<div class="app">

  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>🎨 拼豆图纸定制</h1>
      <p>Perler Bead Pattern Maker</p>
    </div>


    <div class="section">
      <div class="section-title">项目</div>
      <button class="btn btn-primary" onclick="document.getElementById('imageInput').click()">📷 上传图片</button>
      <input type="file" id="imageInput" accept="image/*">
      <button class="btn btn-secondary" onclick="newProject()">🆕 新建空白</button>
      <button class="btn btn-secondary" onclick="document.getElementById('loadInput').click()">📂 打开项目</button>
      <input type="file" id="loadInput" accept=".json">
      <button class="btn btn-secondary" onclick="saveProject()">💾 保存项目</button>
    </div>


    <div class="section">
      <div class="section-title">画布尺寸</div>
      <div class="input-group">
        <label>宽</label>
        <input type="number" id="colsInput" value="29" min="5" max="200">
      </div>
      <div class="input-group">
        <label>高</label>
        <input type="number" id="rowsInput" value="29" min="5" max="200">
      </div>
      <button class="btn btn-secondary" onclick="resizeCanvasSize()">🔄 调整大小</button>
      <button class="btn btn-secondary" onclick="clearCanvas()">🗑️ 清空画布</button>
    </div>


    <div class="section">
      <div class="section-title">工具</div>
      <div class="tools">
        <button class="tool-btn active" data-tool="paint" onclick="setTool('paint')">
          <span class="icon">🖌️</span>画笔
        </button>
        <button class="tool-btn" data-tool="erase" onclick="setTool('erase')">
          <span class="icon">🧽</span>橡皮
        </button>
        <button class="tool-btn" data-tool="fill" onclick="setTool('fill')">
          <span class="icon">🪣</span>填充
        </button>
        <button class="tool-btn" data-tool="picker" onclick="setTool('picker')">
          <span class="icon">💧</span>取色
        </button>
        <button class="tool-btn" data-tool="replace" onclick="setTool('replace')" title="点击画布选源颜色，再点调色板选目标">
          <span class="icon">🔄</span>替换
        </button>
      </div>
      <div id="replaceHint" style="display:none;margin-top:8px;padding:8px 10px;background:#eef;border-radius:6px;font-size:12px;color:#555;line-height:1.6">
        <div id="replaceStep1">① 在画布上点一下要被替换的颜色</div>
        <div id="replaceStep2" style="display:none">
          已选：
          <span id="replaceFromSwatch" style="display:inline-block;width:16px;height:16px;border-radius:3px;vertical-align:middle;border:1px solid #bbb;margin:0 2px"></span>
          <b id="replaceFromLabel" style="vertical-align:middle"></b>
          → 
          <span id="replaceToSwatch" style="display:inline-block;width:16px;height:16px;border-radius:3px;vertical-align:middle;border:1px solid #bbb;margin:0 2px;background:#fff"></span>
          <span id="replaceToLabel" style="vertical-align:middle;color:#999">点调色板选目标色</span>
        </div>
        <div style="margin-top:4px">
          <button class="btn btn-danger" style="padding:2px 8px;font-size:11px;margin-top:2px" onclick="cancelReplace()">取消替换</button>
        </div>
      </div>
    </div>


    <div class="section">
      <div class="section-title">当前颜色</div>
      <div class="selected-color">
        <div class="selected-swatch" id="selectedSwatch"></div>
        <div class="selected-info">
          <div class="name" id="selectedName">-</div>
          <div class="id" id="selectedId">-</div>
        </div>
      </div>


      <div class="section-title">拼豆调色板</div>
      <div class="palette" id="palette"></div>
    </div>




    <div class="section">
      <div class="section-title">导出</div>
      <button class="btn btn-primary" onclick="showExportImageModal()">🖼️ 导出完整图纸图片</button>
      <button style="display: none;" class="btn btn-secondary" onclick="exportPattern()">📋 打印图纸(含图例)</button>
      <button class="btn btn-secondary" onclick="showColorCounts()">📊 颜色用量统计</button>
    </div>


    <div class="section" id="licenseSection">
      <div class="section-title">授权信息</div>
      <div style="font-size:12px;color:#555;display:flex;align-items:center;gap:6px">
        <span id="licenseBadge" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#ccc;flex-shrink:0"></span>
        <span id="licenseStatusText">检测中...</span>
      </div>
      <div id="licenseDetail" style="font-size:11px;color:#999;margin-top:4px;line-height:1.6"></div>
      <button class="btn btn-secondary" id="licenseUnbindBtn" style="display:none;margin-top:6px" onclick="deactivateLicense()">🔓 卸载授权</button>
    </div>

  </aside>


  <main class="main">
    <div class="toolbar">
      <button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()" aria-label="菜单" title="菜单">☰</button>
      <div class="history-controls">
        <button class="history-btn" id="undoBtn" onclick="undo()" title="撤销 (Ctrl+Z)">↶</button>
        <button class="history-btn" id="redoBtn" onclick="redo()" title="重做 (Ctrl+Shift+Z)">↷</button>
      </div>
      <span style="font-size:13px;color:#666;">格子大小:</span>
      <select id="cellSizeSelect" onchange="changeCellSize()" style="padding:6px 10px;border:1px solid #ddd;border-radius:4px;">
        <option value="4">4px</option>
        <option value="6">6px</option>
        <option value="8">8px</option>
        <option value="16">16px</option>
        <option value="20" selected>20px</option>
        <option value="24">24px</option>
        <option value="32">32px</option>
        <option value="40">40px</option>
      </select>
      <label style="font-size:13px;color:#666;display:flex;align-items:center;gap:4px;">
        <input type="checkbox" id="showGrid" checked onchange="redraw()"> 网格线
      </label>
      <label style="font-size:13px;color:#666;display:flex;align-items:center;gap:4px;">
        <input type="checkbox" id="showNumbers" onchange="redraw()"> 颜色编号
      </label>
      <div class="zoom-controls">
        <button class="zoom-btn" onclick="changeCellSize(-4)">−</button>
        <span class="zoom-label" id="zoomLabel">20px</span>
        <button class="zoom-btn" onclick="changeCellSize(4)">+</button>
      </div>
    </div>

    <div class="canvas-area" id="canvasArea">
      <div class="canvas-wrapper">
        <canvas id="gridCanvas"></canvas>
      </div>
    </div>

    <div class="statusbar">
      <span id="statusSize">尺寸: 29 × 29</span>
      <span id="statusPos">位置: -</span>
      <span id="statusColors">已用颜色: 0</span>
      <span id="statusBeads">总豆数: 0</span>
      <span class="status-tip">💡 按住空格+拖动 或 中键拖动 平移画布</span>
    </div>
  </main>
</div>


<div class="modal-overlay" id="countsModal">
  <div class="modal">
    <h2>📊 颜色用量统计</h2>
    <div id="countsContent"></div>
    <button class="btn btn-primary" onclick="document.getElementById('countsModal').classList.remove('show')">关闭</button>
  </div>
</div>
