text-align: center}.canvas-area{flex: 1;overflow: auto;background: #e8e8e8;background-image: radial-gradient(#ccc 1px,transparent 1px);background-size: 20px 20px;display: flex;align-items: flex-start;justify-content: flex-start;padding: 20px;position: relative;min-height: 0}.canvas-area.panning{cursor: grabbing !important}.canvas-area.panning #gridCanvas{cursor: grabbing !important}.canvas-wrapper{position: relative;background: #fff;box-shadow: 0 2px 12px rgba(0,0,0,0.1);margin: auto;flex-shrink: 0}#gridCanvas{display: block;cursor: crosshair;image-rendering: pixelated}body.space-held #gridCanvas{cursor: grab !important}body.space-held.panning #gridCanvas{cursor: grabbing !important}body.space-held .canvas-area{cursor: grab !important}.statusbar{padding: 6px 16px;background: #fff;border-top: 1px solid #e0e0e0;font-size: 12px;color: #888;display: flex;gap: 16px;align-items: center;flex-shrink: 0}.statusbar span{display: flex;align-items: center;gap: 4px}.status-tip{margin-left: auto;font-size: 11px;color: #aaa}.modal-overlay{position: fixed;inset: 0;background: rgba(0,0,0,0.5);display: none;align-items: center;justify-content: center;z-index: 1000}.modal-overlay.show{display: flex}.modal{background: #fff;border-radius: 12px;padding: 24px;max-width: 500px;width: 90%;max-height: 80vh;overflow-y: auto}.modal h2{margin-bottom: 16px;font-size: 18px}.modal .btn{margin-top: 12px}.color-counts{max-height: 300px;overflow-y: auto}.color-count-item{display: flex;align-items: center;padding: 6px 0;border-bottom: 1px solid #f0f0f0}.color-count-swatch{width: 20px;height: 20px;border-radius: 3px;margin-right: 10px;border: 1px solid #ddd}.color-count-name{flex: 1;font-size: 13px}.color-count-num{font-size: 13px;font-weight: 600;color: #667eea;min-width: 40px;text-align: right}::-webkit-scrollbar{width: 8px;height: 8px}::-webkit-scrollbar-track{background: #f1f1f1}::-webkit-scrollbar-thumb{background: #ccc;border-radius: 4px}::-webkit-scrollbar-thumb:hover{background: #aaa}input[type="file"]{display: none}.toast{position: fixed;bottom: 50px;left: 50%;transform: translateX(-50%);background: rgba(0,0,0,0.75);color: #fff;padding: 8px 18px;border-radius: 20px;font-size: 13px;z-index: 2000;opacity: 0;transition: opacity 0.2s;pointer-events: none}.toast.show{opacity: 1}.license-overlay{position: fixed;inset: 0;background: rgba(15,23,42,0.93);z-index: 10000;display: none;align-items: center;justify-content: center;backdrop-filter: blur(4px)}.license-overlay.show{display: flex}.license-card{width: 420px;max-width: 92vw;max-height: 92vh;overflow-y: auto;background: #fff;border-radius: 12px;padding: 28px;box-shadow: 0 20px 60px rgba(0,0,0,0.5)}.license-card h1{font-size: 20px;margin: 0 0 4px;color: #333}.license-card .sub{font-size: 12px;color: #888;margin-bottom: 18px}.license-card input[type="text"],.license-card input[type="password"],.license-card select{width: 100%;padding: 9px 10px;border: 1px solid #ddd;border-radius: 6px;font-size: 13px;box-sizing: border-box}.license-msg{font-size: 12px;min-height: 16px;margin-top: 6px;color: #e63946}.license-msg.ok{color: #2a9d4f}.ui-prompt-mask{position: fixed;inset: 0;background: rgba(15,23,42,0.55);z-index: 99999;display: flex;align-items: center;justify-content: center}.ui-prompt-card{width: 320px;background: #fff;border-radius: 10px;padding: 20px;box-shadow: 0 20px 50px rgba(0,0,0,0.3)}.ui-prompt-title{font-size: 14px;font-weight: 600;color: #333;margin-bottom: 12px}.ui-prompt-input{width: 100%;padding: 8px 10px;border: 1px solid #ddd;border-radius: 6px;font-size: 14px}.ui-prompt-actions{display: flex;gap: 8px;justify-content: flex-end;margin-top: 14px}.ui-prompt-btn{padding: 7px 16px;border: none;border-radius: 6px;font-size: 13px;cursor: pointer}.ui-prompt-btn.cancel{background: #f0f0f0;color: #555}.ui-prompt-btn.cancel:hover{background: #e4e4e4}.ui-prompt-btn.ok{background: #667eea;color: #fff}.ui-prompt-btn.ok:hover{background: #5a6fd6}</style>

<body>
<div class="app">

  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>🎨 拼豆图纸定制</h1>
      <p>Perler Bead Pattern Maker</p>
    </div>


    <div class="section">
      <div class="section-title">项目</div>
      <button class="btn btn-primary" onclick="document.getElementById('imageInput').click()">📷 上传图片</button>
      <input type="file" id="imageInput" accept="image/*">
      <button class="btn btn-secondary" onclick="newProject()">🆕 新建空白</button>
      <button class="btn btn-secondary" onclick="document.getElementById('loadInput').click()">📂 打开项目</button>
      <input type="file" id="loadInput" accept=".json">
      <button class="btn btn-secondary" onclick="saveProject()">💾 保存项目</button>
    </div>


    <div class="section">
      <div class="section-title">画布尺寸</div>
      <div class="input-group">
        <label>宽</label>
        <input type="number" id="colsInput" value="29" min="5" max="200">
      </div>
      <div class="input-group">
        <label>高</label>
        <input type="number" id="rowsInput" value="29" min="5" max="200">
      </div>
      <button class="btn btn-secondary" onclick="resizeCanvasSize()">🔄 调整大小</button>
      <button class="btn btn-secondary" onclick="clearCanvas()">🗑️ 清空画布</button>
    </div>


    <div class="section">
      <div class="section-title">工具</div>
      <div class="tools">
        <button class="tool-btn active" data-tool="paint" onclick="setTool('paint')">
          <span class="icon">🖌️</span>画笔
        </button>
        <button class="tool-btn" data-tool="erase" onclick="setTool('erase')">
          <span class="icon">🧽</span>橡皮
        </button>
        <button class="tool-btn" data-tool="fill" onclick="setTool('fill')">
          <span class="icon">🪣</span>填充
        </button>
        <button class="tool-btn" data-tool="picker" onclick="setTool('picker')">
          <span class="icon">💧</span>取色
        </button>
        <button class="tool-btn" data-tool="replace" onclick="setTool('replace')" title="点击画布选源颜色，再点调色板选目标">
          <span class="icon">🔄</span>替换
        </button>
      </div>
      <div id="replaceHint" style="display:none;margin-top:8px;padding:8px 10px;background:#eef;border-radius:6px;font-size:12px;color:#555;line-height:1.6">
        <div id="replaceStep1">① 在画布上点一下要被替换的颜色</div>
        <div id="replaceStep2" style="display:none">
          已选：
          <span id="replaceFromSwatch" style="display:inline-block;width:16px;height:16px;border-radius:3px;vertical-align:middle;border:1px solid #bbb;margin:0 2px"></span>
          <b id="replaceFromLabel" style="vertical-align:middle"></b>
          → 
          <span id="replaceToSwatch" style="display:inline-block;width:16px;height:16px;border-radius:3px;vertical-align:middle;border:1px solid #bbb;margin:0 2px;background:#fff"></span>
          <span id="replaceToLabel" style="vertical-align:middle;color:#999">点调色板选目标色</span>
        </div>
        <div style="margin-top:4px">
          <button class="btn btn-danger" style="padding:2px 8px;font-size:11px;margin-top:2px" onclick="cancelReplace()">取消替换</button>
        </div>
      </div>
    </div>


    <div class="section">
      <div class="section-title">当前颜色</div>
      <div class="selected-color">
        <div class="selected-swatch" id="selectedSwatch"></div>
        <div class="selected-info">
          <div class="name" id="selectedName">-</div>
          <div class="id" id="selectedId">-</div>
        </div>
      </div>


      <div class="section-title">拼豆调色板</div>
      <div class="palette" id="palette"></div>
    </div>




    <div class="section">
      <div class="section-title">导出</div>
      <button class="btn btn-primary" onclick="showExportImageModal()">🖼️ 导出完整图纸图片</button>
      <button style="display: none;" class="btn btn-secondary" onclick="exportPattern()">📋 打印图纸(含图例)</button>
      <button class="btn btn-secondary" onclick="showColorCounts()">📊 颜色用量统计</button>
    </div>


    <div class="section" id="licenseSection">
      <div class="section-title">授权信息</div>
      <div style="font-size:12px;color:#555;display:flex;align-items:center;gap:6px">
        <span id="licenseBadge" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#ccc;flex-shrink:0"></span>
        <span id="licenseStatusText">检测中...</span>
      </div>
      <div id="licenseDetail" style="font-size:11px;color:#999;margin-top:4px;line-height:1.6"></div>
      <button class="btn btn-secondary" id="licenseUnbindBtn" style="display:none;margin-top:6px" onclick="deactivateLicense()">🔓 卸载授权</button>
    </div>

  </aside>


  <main class="main">
    <div class="toolbar">
      <div class="history-controls">
        <button class="history-btn" id="undoBtn" onclick="undo()" title="撤销 (Ctrl+Z)">↶</button>
        <button class="history-btn" id="redoBtn" onclick="redo()" title="重做 (Ctrl+Shift+Z)">↷</button>
      </div>
      <span style="font-size:13px;color:#666;">格子大小:</span>
      <select id="cellSizeSelect" onchange="changeCellSize()" style="padding:6px 10px;border:1px solid #ddd;border-radius:4px;">
        <option value="4">4px</option>
        <option value="6">6px</option>
        <option value="8">8px</option>
        <option value="16">16px</option>
        <option value="20" selected>20px</option>
        <option value="24">24px</option>
        <option value="32">32px</option>
        <option value="40">40px</option>
      </select>
      <label style="font-size:13px;color:#666;display:flex;align-items:center;gap:4px;">
        <input type="checkbox" id="showGrid" checked onchange="redraw()"> 网格线
      </label>
      <label style="font-size:13px;color:#666;display:flex;align-items:center;gap:4px;">
        <input type="checkbox" id="showNumbers" onchange="redraw()"> 颜色编号
      </label>
      <div class="zoom-controls">
        <button class="zoom-btn" onclick="changeCellSize(-4)">−</button>
        <span class="zoom-label" id="zoomLabel">20px</span>
        <button class="zoom-btn" onclick="changeCellSize(4)">+</button>
      </div>
    </div>

    <div class="canvas-area" id="canvasArea">
      <div class="canvas-wrapper">
        <canvas id="gridCanvas"></canvas>
      </div>
    </div>

    <div class="statusbar">
      <span id="statusSize">尺寸: 29 × 29</span>
      <span id="statusPos">位置: -</span>
      <span id="statusColors">已用颜色: 0</span>
      <span id="statusBeads">总豆数: 0</span>
      <span class="status-tip">💡 按住空格+拖动 或 中键拖动 平移画布</span>
    </div>
  </main>
</div>


<div class="modal-overlay" id="countsModal">
  <div class="modal">
    <h2>📊 颜色用量统计</h2>
    <div id="countsContent"></div>
    <button class="btn btn-primary" onclick="document.getElementById('countsModal').classList.remove('show')">关闭</button>
  </div>
</div>


<div class="toast" id="toast"></div>
